<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2E6B3F"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Smart School">
<title>Rank List &amp; Grading Abstract – Smart School AI Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --board:#1E4D3A; --board-dk:#123526; --chalk:#FFFFFF; --ink:#0E1712; --muted:#3F4C45; --rule:#C9D3CC;
  --saffron:#E9A23B; --gold:#D9A21B; --silver:#9AA5AE; --bronze:#B87333; --red:#B3362C;
  --gA:#11653C; --gB:#1D4C9E; --gC:#94600F; --gD:#A8241A;
  --head:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Hind",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#EEF2EF;color:var(--ink);font-family:var(--body);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-family:var(--head);font-size:1.6rem;line-height:1.15;margin:6px 0 4px;color:var(--board)}
.lead{margin:0 0 14px;color:var(--muted)}
.ctl{background:#fff;border:1px solid var(--rule);border-radius:14px;padding:14px;display:grid;gap:12px}
.ctl label{font-weight:700;display:block;margin-bottom:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>div{flex:1 1 200px}
select,input{width:100%;min-height:46px;border:2px solid var(--rule);border-radius:10px;padding:8px 10px;font:inherit;background:#fff;color:var(--ink)}
select:focus,input:focus,.btn:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.btn{min-height:48px;padding:10px 20px;border-radius:10px;border:0;background:var(--board);color:#fff;font:600 1rem var(--body);cursor:pointer}
.btn:hover{background:var(--board-dk)}
.btn[disabled]{opacity:.6;cursor:wait}
.msg{padding:12px 14px;border-radius:10px;background:#FFF4E0;border:1px solid #F1D29A;margin:12px 0}
.msg a{color:var(--board);font-weight:700}
.note{font-size:.88rem;color:var(--muted);margin:0}
.pv{margin-top:16px;overflow:hidden}
.pv h2{font:700 1.05rem var(--head);margin:0 0 8px;color:var(--board)}
.scaler{transform-origin:top left}
.pv .pg{box-shadow:0 4px 18px rgba(20,40,30,.18);margin-bottom:14px}

/* ---------- printable pages ---------- */
.pg{background:var(--chalk);color:var(--ink);font-family:var(--body);position:relative;overflow:hidden;display:flex;flex-direction:column}
.pg.por{width:210mm;height:296.5mm;padding:6mm 6.5mm 6mm}
.pg.lan{width:297mm;height:209.5mm;padding:6mm 7mm 6mm}
.hd{color:#000;padding:0 1mm 2.4mm;position:relative;text-align:center;border-bottom:.7mm solid #000}

.hd .sc{font:800 19pt/1.1 var(--head);letter-spacing:.2px;color:#000}
.hd .ad{font-size:10pt;font-weight:600;color:#111;margin-top:.8mm}
.hd .tt{display:flex;justify-content:space-between;align-items:baseline;gap:4mm;margin-top:2.6mm;border-top:.3mm solid #000;padding-top:2mm;text-align:left}
.hd .tt b{font:800 15pt/1 var(--head);color:#000;text-transform:none}
.hd .tt span{font-size:11pt;font-weight:700;color:#000}
table.rk{width:100%;border-collapse:collapse;margin-top:5mm;table-layout:fixed}
table.rk th{background:#DCE7DF;color:#0B2A1C;font-weight:800;font-size:8.2pt;line-height:1.1;padding:1.2mm .4mm;border:.3mm solid #8FA597;text-align:center}
table.rk th.sub{font-size:7.6pt;letter-spacing:-.1px;padding-left:0;padding-right:0}
table.rk td{border:.3mm solid #9FB2A5;text-align:center;font-size:9.8pt;font-weight:700;color:#0E1712;padding:0 .4mm;line-height:1.1}
table.rk td.nm{text-align:left;font-weight:700;font-size:9.2pt;line-height:1.05;padding-left:1.4mm;overflow:hidden}table.rk td.nm.s1{font-size:8.6pt}table.rk td.nm.s2{font-size:7.8pt;line-height:1.02}table.rk td.nm.s3{font-size:7.2pt;line-height:1}td.res{font-size:8.8pt}
table.rk tr:nth-child(even) td{background:#EEF3EF}
table.rk td.tot{font-weight:800;font-size:10.4pt}
td.g{font-weight:800;font-size:8.8pt}
.gA{color:var(--gA)}.gB{color:var(--gB)}.gC{color:var(--gC)}.gD{color:var(--gD)}
td.res.fail{color:var(--red);font-weight:800}
td.res.pass{color:var(--gA);font-weight:700}
td.res.abs{color:var(--muted);font-weight:700}
td.rkc{font:800 11pt var(--head)}
tr.m1 td,tr.m2 td,tr.m3 td{background:#FFF6DF!important}
tr.m1 td.rkc span,tr.m2 td.rkc span,tr.m3 td.rkc span{display:inline-grid;place-items:center;width:6.4mm;height:6.4mm;border-radius:50%;color:#fff;font-size:9pt}
tr.m1 td.rkc span{background:var(--gold)}tr.m2 td.rkc span{background:var(--silver)}tr.m3 td.rkc span{background:var(--bronze)}
tr.m1 td:first-child{box-shadow:inset 1.2mm 0 0 var(--gold)}tr.m2 td:first-child{box-shadow:inset 1.2mm 0 0 var(--silver)}tr.m3 td:first-child{box-shadow:inset 1.2mm 0 0 var(--bronze)}
.ft{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:9pt;font-weight:600;color:var(--muted);padding-top:3mm}
.sig{display:flex;gap:18mm}
.sig span{border-top:.35mm solid #2F3B35;padding-top:1mm;min-width:32mm;text-align:center;color:var(--ink);font-weight:700}
.cheer{font:700 9.5pt var(--head);color:var(--board);margin-top:2.6mm}

/* abstract */
table.ab{width:100%;border-collapse:collapse;margin-top:6mm;table-layout:fixed}
table.ab th,table.ab td{border:.35mm solid #8FA597;text-align:center;font-size:11pt;font-weight:700;color:#0E1712;padding:0}
table.ab thead th{background:#DCE7DF;color:#0B2A1C;font-weight:800}
table.ab thead tr:first-child th{font-size:10pt;padding:1.6mm .4mm;background:#D9DED9;color:#000;border-color:#8FA597}
table.ab thead tr:first-child th.tg{background:#C9CFC9;color:#000;border-color:#8FA597}
table.ab thead tr:nth-child(2) th{font-size:9.2pt;padding:1mm 0}
table.ab th.gr{background:#DCE7DF;color:#0B2A1C;font:800 12.5pt var(--head)}
table.ab td.t{font-weight:800;background:#EEF3EF}
table.ab td.z{color:#7D8A82;font-weight:600}
table.ab tr.sum td{font-weight:800;background:#EAF0EB}
table.ab tr.pp td{font-weight:800;background:#FFEDC6;color:#6A3D08;font-size:9.4pt}
table.ab tr.pp th,table.ab tr.sum th{font-size:10pt}
table.ab td.gl{border-left:.6mm solid #6E8A7A}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.cb{margin-top:3.2mm;display:flex;justify-content:space-between;align-items:baseline;border-bottom:.5mm solid #000;padding:0 .6mm .6mm;font:800 11.5pt/1.1 var(--head);color:#000}
.cb small{font:700 9pt var(--body);color:#222}
.cb+table.rk{margin-top:1.4mm}
</style>
<style id="ssat-inp">input,select,textarea{color:var(--ink,#18232E)!important;-webkit-text-fill-color:var(--ink,#18232E);font-size:16px;font-weight:600}input::placeholder,textarea::placeholder{color:var(--muted,#56636F)!important;-webkit-text-fill-color:var(--muted,#56636F);opacity:1;font-weight:500}select option{color:#18232E;background:#fff}.status{font-size:1rem}</style><style id="ssat-flat">/* clean look: no colour bands or boxes; dotted lines between items; colour only in bold text and buttons */
a.ssat-home,.ssat-home{background:transparent!important;color:#14532D!important;font-weight:800!important;border-bottom:1.5px dotted rgba(110,125,140,.6)!important}
@media (prefers-color-scheme: dark){a.ssat-home,.ssat-home{color:#8FD3A6!important}}
.panel,#setup,.ctl,.box,.idcard,.loadbox{background:transparent!important;border:0!important;border-bottom:1.5px dotted rgba(110,125,140,.6)!important;border-radius:0!important;box-shadow:none!important;padding-left:2px!important;padding-right:2px!important}
#dgL{background:transparent!important;border:0!important;box-shadow:none!important}
#dgL>*{background:transparent!important;border:0!important;border-bottom:1.5px dotted rgba(110,125,140,.6)!important;border-radius:0!important;box-shadow:none!important}
.tile{background:transparent!important;border:0!important;border-bottom:1.5px dotted rgba(110,125,140,.6)!important;border-radius:0!important;min-height:0!important;box-shadow:none!important}
.tiles{gap:0!important}
.subs .st{background:transparent!important;color:var(--c)!important;border:2px solid var(--c)!important;border-radius:10px!important;box-shadow:none!important;padding-left:14px!important;min-height:88px!important}
.subs .st::before,.subs .st::after{display:none!important}
.subs .st *{color:inherit}
.subs .st em{background:transparent!important;border:1.5px solid var(--c)!important;color:var(--c)!important;font-weight:700}
.subs .st[aria-pressed=true],.subs .st.on{background:var(--c)!important;color:#fff!important}
.subs .st[aria-pressed=true] em,.subs .st.on em{color:#fff!important;border-color:#fff!important}

#setup .bar,.wrap>.bar,#dutyRows>*,.roles,.rolegrid>*{background:transparent!important;border:0!important;border-bottom:1.5px dotted rgba(110,125,140,.6)!important;border-radius:0!important;box-shadow:none!important}
</style>

/* If the marks sheet has student names but no marks yet, explain it instead of showing an empty page. */
(function(){
  function explain(){
    var ctl=document.getElementById("ctl"),ex=document.getElementById("exSel"),bad=document.getElementById("bad");
    if(!bad||(ex&&ex.options.length))return;
    if(ctl)ctl.hidden=true;
    var pv=document.getElementById("pv");if(pv)pv.hidden=true;
    bad.innerHTML="No marks found in this sheet yet. Type the marks for at least one exam (FA-1, SA-1 …), save the file, then upload it again on the <a href=\"index.html#how\">Home page</a>.<br><small>ఈ షీట్‌లో ఇంకా మార్కులు లేవు. కనీసం ఒక పరీక్ష మార్కులు టైప్ చేసి, మళ్ళీ అప్‌లోడ్ చేయండి.</small>";
    bad.hidden=false;
  }
  addEventListener("unhandledrejection",function(){setTimeout(explain,0)});
  addEventListener("error",function(){setTimeout(explain,0)});
})();
</script>

<body>
<main class="wrap">
  <h1 id="h1">Rank List</h1>
  <p class="lead" id="lead">Choose the exam and download a PDF ready to print.</p>
  <div id="need" class="msg" hidden>No marks file yet. Go to the <a href="index.html">home page</a>, upload the marks file or paste the Google Sheet link, then come back here.</div>
  <div id="bad" class="msg" hidden></div>
  <section class="ctl" id="ctl" hidden>
    <div class="row">
      <div><label for="exSel">Exam</label><select id="exSel"></select></div>
      <div id="clsBox" hidden><label for="clsSel">Class</label><select id="clsSel"></select></div>
      <div style="flex:0 0 auto"><button class="btn" id="dl" type="button">⬇ Download PDF</button></div>
    </div>
    <p class="note" id="info"></p>
  </section>
  <section class="pv" id="pv" hidden>
    <h2>Preview</h2>
    <div id="sc" class="scaler"><div id="pages"></div></div>
  </section>
</main>
